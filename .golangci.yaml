# See the dedicated "version" documentation section.
version: "2"
linters:
  # See the dedicated "linters" documentation section.
  default: all
  disable:
  - wsl
  - gomodguard
  enable:
  - wsl_v5
  - gomodguard_v2
  settings:
    depguard:
      rules:
        main:
          allow:
          - $gostd
          - github.com/BeConfused/base-planner
          - gopkg.in/yaml.v3
